name: taskflow-platform

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskflow}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT_HOST:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-taskflow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      REDIS_URL: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-taskflow-attachments}
      ATTACHMENT_ENABLED: ${ATTACHMENT_ENABLED:-true}
      REMINDER_ENABLED: ${REMINDER_ENABLED:-true}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      TASKFLOW_JWT_SECRET: ${TASKFLOW_JWT_SECRET:?Set TASKFLOW_JWT_SECRET in .env}
      TASKFLOW_AUTH_LOGIN_RATE_LIMIT_ENABLED: ${TASKFLOW_AUTH_LOGIN_RATE_LIMIT_ENABLED:-true}
      TASKFLOW_AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${TASKFLOW_AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-10}
      TASKFLOW_AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${TASKFLOW_AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      TASKFLOW_BOOTSTRAP_ADMIN_ENABLED: ${TASKFLOW_BOOTSTRAP_ADMIN_ENABLED:-true}
      TASKFLOW_BOOTSTRAP_ADMIN_USERNAME: ${TASKFLOW_BOOTSTRAP_ADMIN_USERNAME:-admin}
      TASKFLOW_BOOTSTRAP_ADMIN_EMPLOYEE_NO: ${TASKFLOW_BOOTSTRAP_ADMIN_EMPLOYEE_NO:-ADMIN001}
      TASKFLOW_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${TASKFLOW_BOOTSTRAP_ADMIN_DISPLAY_NAME:-System Administrator}
      TASKFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${TASKFLOW_BOOTSTRAP_ADMIN_PASSWORD:?Set TASKFLOW_BOOTSTRAP_ADMIN_PASSWORD in .env}
      WEBSOCKET_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q status <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
