name: integration-security

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-security:
    name: Testcontainers, coverage and dependency scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit and Testcontainers integration tests with coverage gate
        run: ./mvnw -Dtaskflow.integration=true verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit (advisory while network/database availability is not guaranteed)
        working-directory: frontend
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json"
          status=$?
          set -e
          echo "npm audit exit code: $status"
          echo "The artifact records whether the command found advisories or could not reach the registry."

      - name: Run OWASP Dependency-Check (advisory while NVD availability is not guaranteed)
        continue-on-error: true
        run: ./mvnw -Psecurity-scan -DskipTests verify

      - name: Upload coverage and dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-integration-security-reports
          if-no-files-found: warn
          path: |
            target/site/jacoco/**
            target/dependency-check-report.*
            ${{ runner.temp }}/npm-audit.json
