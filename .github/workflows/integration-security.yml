name: integration-security

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-security:
    name: Testcontainers, coverage and dependency scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_ARGS: ''
      MAVEN_OPTS: ''
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit and Testcontainers integration tests with coverage gate
        run: bash ./mvnw -Dtaskflow.integration=true verify

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit (high and critical findings block)
        id: npm-audit
        working-directory: frontend
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=high --registry=https://registry.npmjs.org --json > "$RUNNER_TEMP/npm-audit.json" 2> "$RUNNER_TEMP/npm-audit.stderr"
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/npm-audit.exit"
          echo "npm audit exit code: $status"

      - name: Run OWASP Dependency-Check (high and critical findings block)
        id: dependency-check
        continue-on-error: true
        run: |
          set +e
          bash ./mvnw -Psecurity-scan -DskipTests \
            -Ddependency-check.data.directory="$RUNNER_TEMP/dependency-check-data" verify
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/dependency-check.exit"
          echo "OWASP Dependency-Check exit code: $status"

      - name: Enforce dependency security gate
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = process.env.RUNNER_TEMP;
          const read = (name) => fs.readFileSync(`${path}/${name}`, 'utf8').trim();
          const npmExit = Number(read('npm-audit.exit'));
          const owaspExit = Number(read('dependency-check.exit'));
          let npmReport;
          try {
            npmReport = JSON.parse(fs.readFileSync(`${path}/npm-audit.json`, 'utf8'));
          } catch (error) {
            console.error(`npm audit did not produce valid JSON: ${error.message}`);
            process.exit(1);
          }
          const vulnerabilities = npmReport.metadata?.vulnerabilities;
          if (!vulnerabilities) {
            console.error('npm audit report has no vulnerability metadata; registry or scan failure is not green.');
            process.exit(1);
          }
          console.log(`npm audit: moderate=${vulnerabilities.moderate ?? 0}, high=${vulnerabilities.high ?? 0}, critical=${vulnerabilities.critical ?? 0}`);
          console.log(`OWASP Dependency-Check exit code: ${owaspExit}`);
          if (npmExit !== 0 || (vulnerabilities.high ?? 0) > 0 || (vulnerabilities.critical ?? 0) > 0 || owaspExit !== 0) {
            console.error('Dependency security gate failed: scan failure or confirmed high/critical findings must be reviewed.');
            process.exit(1);
          }
          NODE

      - name: Upload coverage and dependency reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: taskflow-integration-security-reports
          if-no-files-found: ignore
          path: |
            target/site/jacoco/**
            target/dependency-check-report.*
            ${{ runner.temp }}/npm-audit.json
            ${{ runner.temp }}/npm-audit.stderr
            ${{ runner.temp }}/npm-audit.exit
            ${{ runner.temp }}/dependency-check.exit
