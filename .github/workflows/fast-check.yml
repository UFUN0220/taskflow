name: fast-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-check:
    name: Backend tests, frontend build, static manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend fast tests
        run: ./mvnw test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend type check
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1

      - name: Validate Compose interpolation
        env:
          MYSQL_ROOT_PASSWORD: ci-not-a-secret
          MYSQL_USER: ci-taskflow
          MYSQL_PASSWORD: ci-not-a-secret
          RABBITMQ_DEFAULT_USER: ci-taskflow
          RABBITMQ_DEFAULT_PASS: ci-not-a-secret
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-not-a-secret
          TASKFLOW_JWT_SECRET: ci-not-a-secret-jwt-value
          TASKFLOW_BOOTSTRAP_ADMIN_PASSWORD: ci-not-a-secret-admin
        run: docker compose config --quiet

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s > "$RUNNER_TEMP/taskflow-kustomize.yaml"
