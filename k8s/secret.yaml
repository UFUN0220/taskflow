apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secret
  labels:
    app.kubernetes.io/name: taskflow-platform
type: Opaque
stringData:
  # Local-learning defaults only. Replace these values before applying to any shared cluster.
  DB_USERNAME: taskflow
  DB_PASSWORD: change-me-compose-database-password
  RABBITMQ_USERNAME: taskflow
  RABBITMQ_PASSWORD: change-me-compose-rabbit-password
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: change-me-minio-secret
  TASKFLOW_JWT_SECRET: change-me-k8s-jwt-secret-at-least-32-chars
  TASKFLOW_BOOTSTRAP_ADMIN_PASSWORD: change-me-before-apply
