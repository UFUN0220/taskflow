apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-local-edge-nginx
  labels:
    app.kubernetes.io/name: taskflow-local-edge
    app.kubernetes.io/part-of: taskflow-platform
data:
  nginx.conf: |
    events {}
    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      server {
        listen 8443 ssl;
        server_name taskflow.local;
        ssl_certificate /etc/taskflow-tls/tls.crt;
        ssl_certificate_key /etc/taskflow-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
          proxy_pass http://backend.taskflow.svc.cluster.local:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /ws/ {
          proxy_pass http://backend.taskflow.svc.cluster.local:8080;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_read_timeout 3600s;
        }

        location / {
          proxy_pass http://frontend.taskflow.svc.cluster.local:80;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $remote_addr;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-local-edge
  labels:
    app.kubernetes.io/name: taskflow-local-edge
    app.kubernetes.io/part-of: taskflow-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-local-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-local-edge
        app.kubernetes.io/part-of: taskflow-platform
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls
              mountPath: /etc/taskflow-tls
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: taskflow-local-edge-nginx
        - name: tls
          secret:
            secretName: taskflow-tls
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-local-edge
  labels:
    app.kubernetes.io/name: taskflow-local-edge
    app.kubernetes.io/part-of: taskflow-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskflow-local-edge
  ports:
    - name: https
      port: 8443
      targetPort: https
