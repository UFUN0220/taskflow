apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow-edge
  labels:
    app.kubernetes.io/name: taskflow-platform
    app.kubernetes.io/part-of: taskflow-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - taskflow.local
      secretName: taskflow-tls
  rules:
    - host: taskflow.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
