apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: taskflow-frontend
    app.kubernetes.io/part-of: taskflow-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-frontend
        app.kubernetes.io/part-of: taskflow-platform
    spec:
      containers:
        - name: frontend
          image: taskflow-platform-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: taskflow-frontend
    app.kubernetes.io/part-of: taskflow-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskflow-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
