apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secret
  labels:
    app.kubernetes.io/name: taskflow-platform
type: Opaque
stringData:
  # Intentionally empty placeholders. Create this Secret out-of-band for a local
  # cluster; never commit real credentials or apply this template to a shared/prod cluster.
  DB_USERNAME: ""
  DB_PASSWORD: ""
  RABBITMQ_USERNAME: ""
  RABBITMQ_PASSWORD: ""
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
  TASKFLOW_JWT_SECRET: ""
  TASKFLOW_BOOTSTRAP_ADMIN_PASSWORD: ""
