apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  labels:
    app.kubernetes.io/name: taskflow-platform
data:
  # This manifest is for the local-learning profile only. Shared/prod clusters must
  # provide SPRING_PROFILES_ACTIVE=prod through a separate deployment overlay.
  SPRING_PROFILES_ACTIVE: dev
  SERVER_FORWARD_HEADERS_STRATEGY: none
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE: health,info,metrics
  INFRA_HOST: host.docker.internal
  MYSQL_DATABASE: taskflow
  MYSQL_PORT: "3307"
  REDIS_PORT: "6380"
  RABBITMQ_PORT: "5673"
  MINIO_PORT: "9000"
  MINIO_BUCKET: taskflow-attachments
  WEBSOCKET_ENDPOINT: /ws/notifications
  WEBSOCKET_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  ATTACHMENT_ENABLED: "true"
  REMINDER_ENABLED: "true"
  AUDIT_ENABLED: "true"
