spring.config.activate.on-profile=dev

# Development-only fallback values. Shared or production environments must use application-prod.properties.
taskflow.auth.jwt-secret=${TASKFLOW_JWT_SECRET:taskflow-dev-only-secret-change-before-sharing-32}
taskflow.auth.browser-cookie.secure=false
taskflow.auth.browser-cookie.same-site=Lax
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE:health,info,metrics}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
taskflow.security.require-explicit-secrets=false
