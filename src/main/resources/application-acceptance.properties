spring.config.activate.on-profile=acceptance

# All acceptance credentials are supplied by the process environment. Missing
# values fail during configuration binding; no test password is stored here.
taskflow.acceptance.enabled=true
taskflow.acceptance.admin.username=${TASKFLOW_ACCEPTANCE_ADMIN_USERNAME}
taskflow.acceptance.admin.password=${TASKFLOW_ACCEPTANCE_ADMIN_PASSWORD}
taskflow.acceptance.admin.employee-no=${TASKFLOW_ACCEPTANCE_ADMIN_EMPLOYEE_NO:ACCEPTANCE001}
taskflow.acceptance.admin.display-name=${TASKFLOW_ACCEPTANCE_ADMIN_DISPLAY_NAME:Acceptance Administrator}
taskflow.acceptance.test-user-password=${TASKFLOW_ACCEPTANCE_TEST_USER_PASSWORD}

taskflow.auth.jwt-secret=${TASKFLOW_ACCEPTANCE_JWT_SECRET}
taskflow.auth.bootstrap-admin.enabled=false
taskflow.auth.browser-cookie.enabled=true
taskflow.auth.browser-cookie.http-only=true
taskflow.auth.browser-cookie.secure=false
taskflow.auth.browser-cookie.same-site=Lax
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.url=${REDIS_URL}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
taskflow.attachment.minio.access-key=${MINIO_ACCESS_KEY}
taskflow.attachment.minio.secret-key=${MINIO_SECRET_KEY}
taskflow.attachment.minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
taskflow.attachment.minio.bucket=${MINIO_BUCKET:taskflow-attachments}

spring.flyway.enabled=true
taskflow.audit.enabled=true
taskflow.attachment.enabled=true
taskflow.reminder.enabled=true
taskflow.websocket.enabled=true
taskflow.websocket.diagnostics.enabled=true
taskflow.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:15173,http://127.0.0.1:15173}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.forward-headers-strategy=none
taskflow.security.require-explicit-secrets=true
