spring.config.activate.on-profile=prod

# Every sensitive value below is intentionally required. Missing environment variables fail
# startup instead of falling back to development credentials.
taskflow.auth.jwt-secret=${TASKFLOW_JWT_SECRET}
taskflow.auth.browser-cookie.enabled=true
taskflow.auth.browser-cookie.http-only=true
taskflow.auth.browser-cookie.secure=true
taskflow.auth.browser-cookie.same-site=Lax
taskflow.auth.browser-cookie.path=/
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.url=${REDIS_URL}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
taskflow.attachment.minio.access-key=${MINIO_ACCESS_KEY}
taskflow.attachment.minio.secret-key=${MINIO_SECRET_KEY}
taskflow.attachment.minio.endpoint=${MINIO_ENDPOINT}
taskflow.attachment.minio.bucket=${MINIO_BUCKET}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.forward-headers-strategy=none
taskflow.security.require-explicit-secrets=true
taskflow.security.headers.csp=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:
