spring.config.activate.on-profile=test

# Test-only secret; never use this profile outside automated tests.
taskflow.auth.jwt-secret=${TASKFLOW_JWT_SECRET:test-only-taskflow-secret-01234567890123456789}
management.endpoints.web.exposure.include=health
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
taskflow.security.require-explicit-secrets=false
