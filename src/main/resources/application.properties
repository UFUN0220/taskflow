spring.application.name=taskflow-backend
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}

# Do not enable framework forwarded-header trust by default. If a production ingress is
# introduced, configure and document the trusted proxy boundary explicitly.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# Stage 0 exposes only a non-sensitive health signal.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE:health,info,metrics}
management.endpoint.health.show-details=never
management.info.env.enabled=false
management.endpoint.health.probes.enabled=true

# Database connections are supplied by the local profile or environment.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Enable explicitly when a MySQL database is available. This keeps no-database tests isolated.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.servlet.multipart.max-file-size=${ATTACHMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${ATTACHMENT_MAX_REQUEST_SIZE:12MB}

# MyBatis-Plus stage 2 defaults.
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=AUTO
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# Stage 3 authentication. Replace the local secret in every deployed environment.
taskflow.auth.jwt-secret=${TASKFLOW_JWT_SECRET:}
taskflow.auth.jwt-expiration-minutes=${TASKFLOW_JWT_EXPIRATION_MINUTES:120}
taskflow.auth.login-rate-limit-enabled=${TASKFLOW_AUTH_LOGIN_RATE_LIMIT_ENABLED:true}
taskflow.auth.login-rate-limit-max-attempts=${TASKFLOW_AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
taskflow.auth.login-rate-limit-window-seconds=${TASKFLOW_AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
taskflow.auth.bootstrap-admin.enabled=${TASKFLOW_BOOTSTRAP_ADMIN_ENABLED:false}
taskflow.auth.bootstrap-admin.username=${TASKFLOW_BOOTSTRAP_ADMIN_USERNAME:admin}
taskflow.auth.bootstrap-admin.employee-no=${TASKFLOW_BOOTSTRAP_ADMIN_EMPLOYEE_NO:ADMIN001}
taskflow.auth.bootstrap-admin.display-name=${TASKFLOW_BOOTSTRAP_ADMIN_DISPLAY_NAME:System Administrator}
taskflow.auth.bootstrap-admin.password=${TASKFLOW_BOOTSTRAP_ADMIN_PASSWORD:}

# Stage 11 WebSocket notification center. Authentication still happens in the STOMP CONNECT frame.
taskflow.websocket.enabled=${WEBSOCKET_ENABLED:true}
taskflow.websocket.endpoint=${WEBSOCKET_ENDPOINT:/ws/notifications}
taskflow.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Security headers are enabled for API responses in every profile; prod overrides the
# management/OpenAPI exposure and requires explicit secrets.
taskflow.security.headers.csp=${TASKFLOW_SECURITY_HEADERS_CSP:default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:}

# Stage 12 audit and observability. Audit writes require the database schema; slow request logs do not.
taskflow.audit.enabled=${AUDIT_ENABLED:false}
taskflow.observability.slow-request.threshold-ms=${SLOW_REQUEST_THRESHOLD_MS:1000}

# Stage 8 attachment storage. Disabled by default so no-database/unit tests remain isolated.
taskflow.attachment.enabled=${ATTACHMENT_ENABLED:false}
taskflow.attachment.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
taskflow.attachment.minio.access-key=${MINIO_ACCESS_KEY:}
taskflow.attachment.minio.secret-key=${MINIO_SECRET_KEY:}
taskflow.attachment.minio.bucket=${MINIO_BUCKET:taskflow-attachments}
taskflow.attachment.max-file-size-bytes=${ATTACHMENT_MAX_FILE_SIZE_BYTES:10485760}
taskflow.attachment.presigned-expiry-seconds=${ATTACHMENT_PRESIGNED_EXPIRY_SECONDS:600}

# Stage 9 reminder plans. Disabled by default; enable only with Redis and RabbitMQ available.
taskflow.reminder.enabled=${REMINDER_ENABLED:false}
taskflow.reminder.due-soon-lead-time=${REMINDER_DUE_SOON_LEAD_TIME:24h}
taskflow.reminder.scan-batch-size=${REMINDER_SCAN_BATCH_SIZE:100}
taskflow.reminder.scan-delay-ms=${REMINDER_SCAN_DELAY_MS:10000}
taskflow.reminder.rebuild-delay-ms=${REMINDER_REBUILD_DELAY_MS:300000}
taskflow.reminder.lock-ttl=${REMINDER_LOCK_TTL:30s}
taskflow.reminder.redis-key=${REMINDER_REDIS_KEY:taskflow:reminders:due}
taskflow.reminder.lock-key=${REMINDER_LOCK_KEY:taskflow:reminders:scan-lock}
taskflow.reminder.rabbit.exchange=${REMINDER_RABBIT_EXCHANGE:taskflow.reminder}
taskflow.reminder.rabbit.queue=${REMINDER_RABBIT_QUEUE:taskflow.reminder.dispatch}
taskflow.reminder.rabbit.routing-key=${REMINDER_RABBIT_ROUTING_KEY:reminder.due}
taskflow.reminder.rabbit.task-status-routing-key=${REMINDER_RABBIT_TASK_STATUS_ROUTING_KEY:task.status.changed}
taskflow.reminder.rabbit.retry-exchange=${REMINDER_RABBIT_RETRY_EXCHANGE:taskflow.reminder.retry}
taskflow.reminder.rabbit.retry-queue=${REMINDER_RABBIT_RETRY_QUEUE:taskflow.reminder.retry}
taskflow.reminder.rabbit.retry-routing-key=${REMINDER_RABBIT_RETRY_ROUTING_KEY:reminder.retry}
taskflow.reminder.rabbit.dead-letter-exchange=${REMINDER_RABBIT_DEAD_LETTER_EXCHANGE:taskflow.reminder.dlx}
taskflow.reminder.rabbit.dead-letter-queue=${REMINDER_RABBIT_DEAD_LETTER_QUEUE:taskflow.reminder.dead}
taskflow.reminder.rabbit.dead-letter-routing-key=${REMINDER_RABBIT_DEAD_LETTER_ROUTING_KEY:reminder.dead}
taskflow.reminder.rabbit.max-attempts=${REMINDER_RABBIT_MAX_ATTEMPTS:3}
taskflow.reminder.rabbit.retry-delay-ms=${REMINDER_RABBIT_RETRY_DELAY_MS:5000}
